<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeKetab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📚 CodeKetab</h1>
  <p>مكتبة كتب إسلامية ودعوية مجانية</p>
</header>

<section class="hero">
  <h2>شارك العلم بسهولة</h2>
  <p>روابط مباشرة + QR Code لكل كتاب</p>
</section>

<section class="books">

  <div class="book-card">
    <img src="https://via.placeholder.com/200x280" alt="كتاب">
    <h3>تعرف على الإسلام</h3>
    <p>كتاب تعريفي لغير المسلمين</p>

    <a href="books/islam.pdf" target="_blank" class="btn">قراءة الكتاب</a>

    <img
      class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://codeketab.github.io/books/islam.pdf"
      alt="QR Code"
    >
  </div>


  <div class="book-card">
    <img src="https://via.placeholder.com/200x280" alt="كتاب">
    <h3>حصن المسلم</h3>
    <p>أذكار يومية للمسلمين</p>

    <a href="books/hesn.pdf" target="_blank" class="btn">قراءة الكتاب</a>

    <img
      class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://codeketab.github.io/books/hesn.pdf"
      alt="QR Code"
    >
  </div>

</section>

<footer>
  <p>© 2025 CodeKetab - جميع الحقوق محفوظة</p>
</footer>

</body>
</html>
